name: Compilar Cliente Vortek Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Instalar Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Eliminar NDK r27 Preinstalado y Forzar r26b
        run: |
          # Borramos el NDK 27 del servidor de GitHub para que no interfiera
          rm -rf /usr/local/lib/android/sdk/ndk/27*
          
          # Instalamos el r26b de forma estricta
          echo "y" | sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Configurar y Compilar Proyecto con CMake
        run: |
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -B build
          
          ninja -C build

      - name: Guardar Binarios Compilados (.so)
        uses: actions/upload-artifact@v4
        with:
          name: vortek-driver-mali-custom
          path: |
            build/*.so
            vortek_icd.aarch64.json
