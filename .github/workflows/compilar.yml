name: Compilar Cliente Vortek Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Instalar Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Eliminar NDK 27 global del sistema
        run: |
          # Erradicamos por completo el NDK 27 de la máquina virtual
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27*

      - name: Configurar e Instalar NDK r26b Puro de Google
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Configurar y Compilar Proyecto con CMake
        run: |
          # Forzamos a CMake a leer la ruta del NDK r26b usando la variable global $ANDROID_NDK_ROOT
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -B build
          
          ninja -C build

      - name: Guardar Binarios Compilados (.so)
        uses: actions/upload-artifact@v4
        with:
          name: vortek-driver-mali-custom
          path: |
            build/*.so
            vortek_icd.aarch64.json
