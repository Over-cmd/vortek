name: Compilar Cliente Vortek Custom

on:
  workflow_dispatch: # Permite activar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Sistema y Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build wget unzip

      - name: Descargar e Instalar Android NDK r26b de forma Directa
        run: |
          wget https://google.com -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r26b" >> $GITHUB_ENV

      - name: Configurar y Compilar Proyecto con CMake
        run: |
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -B build
          
          ninja -C build

      - name: Guardar Binarios Compilados (.so)
        uses: actions/upload-artifact@v4
        with:
          name: vortek-driver-mali-custom
          path: |
            build/*.so
            vortek_icd.aarch64.json
