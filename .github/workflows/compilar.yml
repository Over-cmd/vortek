name: Compilar Cliente Vortek Custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente de Vortek
        uses: actions/checkout@v4

      - name: Instalar Ninja y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Clonar de forma Nativa las Cabeceras Oficiales de Vulkan Faltantes
        run: |
          # Creamos el directorio necesario
          mkdir -p include/vulkan
          
          # 🚀 URL CORREGIDA Y COMPLETA AQUÍ:
          git clone --depth 1 -b v1.3.268 https://github.com/KhronosGroup/Vulkan-Headers.git khronos_headers
          
          # Copiamos exactamente todos los archivos .h que faltan a la carpeta del proyecto
          cp khronos_headers/include/vulkan/*.h include/vulkan/
          
          # Limpiamos la carpeta temporal
          rm -rf khronos_headers

      - name: Configurar e Instalar NDK r26b Oficial de Google
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Configurar y Compilar Proyecto con CMake
        run: |
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=/usr/local/lib/android/sdk/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -B build
          
          ninja -C build

      - name: Guardar Binarios Compilados (.so)
        uses: actions/upload-artifact@v4
        with:
          name: vortek-driver-mali-custom
          path: |
            build/*.so
            vortek_icd.aarch64.json
