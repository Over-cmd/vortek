name: Compilar Cliente Vortek Custom

on:
  workflow_dispatch: # Permite activar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android NDK r26b
        run: |
          echo "y" | sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Instalar Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configurar y Compilar Proyecto con CMake
        run: |
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -B build
          
          ninja -C build

      - name: Guardar Binarios Compilados (.so)
        uses: actions/upload-artifact@v4
        with:
          name: vortek-driver-mali-custom
          path: |
            build/*.so
            vortek_icd.aarch64.json
