name: Compilar Vortek Standalone (wrapper.tzst)

on:
  workflow_dispatch: # Activa el botón de disparo manual en la pestaña Actions
  push:
    branches: [ main ]

jobs:
  build-vortek:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar tu repositorio de Vortek
        uses: actions/checkout@v4

      - name: 2. Localizar y Configurar el Android NDK Preinstalado
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk-bundle" >> $GITHUB_ENV
          if [ -d "${ANDROID_SDK_ROOT}/ndk" ]; then
            NDK_VER=$(ls -1 ${ANDROID_SDK_ROOT}/ndk | tail -n 1)
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi

      - name: 3. Configurar CMake con el Toolchain del NDK de Android
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release \
                ..

      - name: 4. Compilar el Binario .so de Vortek
        run: |
          cd build
          make -j$(nproc)

      - name: 5. Instalar Herramientas de Compresión Zstd en el Servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: 6. Fabricar Estructura Unix y Empaquetar en wrapper.tzst
        run: |
          # Creamos el árbol de directorios estándar exigido por Bannerlator
          mkdir -p estructura_wrapper/usr/lib
          mkdir -p estructura_wrapper/usr/share/vulkan/icd.d
          
          # 1. Volcamos la librería compartida con su nombre obligatorio wrapper.so
          cp build/libvulkan_wrapper.so estructura_wrapper/usr/lib/
          
          # 2. Replicamos el manifiesto ICD oficial en una sola línea exacta
          echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > estructura_wrapper/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          
          # 3. 🚨 FIJADO MASTER: Forzamos la compresión desde la raíz limpia de carpetas
          # Usamos el parámetro --no-same-owner y nos posicionamos dentro para evitar rutas fantasmas de Linux
          cd estructura_wrapper
          tar --no-same-owner -I 'zstd -19 -T0' -cf ../vortek.wrapper.tzst usr
          cd ..
          
          # Preparamos la carpeta de salida limpia para el artefacto descargable
          mkdir -p salida_final
          cp vortek.wrapper.tzst salida_final/

      - name: 7. Guardar y Subir el .wrapper.tzst como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vortek-Wrapper-Bannerlator
          path: salida_final/
