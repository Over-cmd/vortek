name: Compilar Vortek Standalone (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-vortek:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar tu repositorio de Vortek
        uses: actions/checkout@v4

      - name: 2. Localizar y Configurar el Android NDK Preinstalado
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk-bundle" >> $GITHUB_ENV
          if [ -d "${ANDROID_SDK_ROOT}/ndk" ]; then
            NDK_VER=$(ls -1 ${ANDROID_SDK_ROOT}/ndk | tail -n 1)
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi

      - name: 3. Configurar CMake con el Toolchain del NDK de Android
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release \
                ..

      - name: 4. Compilar el Binario .so de Vortek
        run: |
          cd build
          make -j$(nproc)

      - name: 5. Organizar el Paquete del Driver Gráfico Interceptor
        run: |
          mkdir -p salida_vortek
          cp build/libvulkan_vortek.so salida_vortek/
          if [ -f vortek_icd.aarch64.json ]; then
            cp vortek_icd.aarch64.json salida_vortek/
          fi

      - name: 6. Guardar y Subir el ZIP como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vortek-SuperDriver-Mali-ARM64
          path: salida_vortek/
