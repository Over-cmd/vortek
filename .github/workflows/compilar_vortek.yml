      - name: 6. Forjar Paquete Esencial de Capa Vulkan (wrapper.tzst)
        run: |
          WRAPPER_SO="build/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
            echo "-> [Host] ¡Éxito! Estructurando tu paquete híbrido de producción..."
            rm -rf final_pkg wrapper.tzst
            
            # 🚨 TRUCO MAESTRO: Creamos ambas carpetas para asegurar compatibilidad total
            mkdir -p final_pkg/usr/lib final_pkg/usr/share/vulkan/icd.d final_pkg/usr/share/vulkan/implicit_layer.d
            
            # 1. Copiamos la librería nativa y le asignamos los permisos de ejecución de Android
            cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
            chmod -R 755 final_pkg/usr/lib/
            
            # 2. Sellamos el nombre dinámico del objeto compartido con patchelf
            patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
            find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
            
            # 3. 🚨 EL ENGAÑO PERFECTO: Escribimos el JSON de capa en su sitio real para el motor de Linux...
            cat << 'EOF' > final_pkg/usr/share/vulkan/implicit_layer.d/vortek_layer.json
            {
                "file_format_version": "1.0.0",
                "layer": {
                    "name": "VK_LAYER_VORTEK_interceptor",
                    "type": "GLOBAL",
                    "library_path": "libvulkan_wrapper.so",
                    "api_version": "1.3.289",
                    "description": "Vortek Standalone Texture Interceptor Layer",
                    "implementation_version": "1"
                }
            }
            EOF
            
            # 4. 🚨 ...Y escribimos el JSON de Driver plano en icd.d con el formato exacto del original 
            # Esto es lo que obligará a la interfaz de Bannerlator a leer y poblar las capabilities en la pantalla de instalación
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
            
            sync && sleep 3
            
            # Comprimimos la jerarquía completa
            cd final_pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..
            echo "-> ¡Paquete híbrido forjado con éxito!"
          else
            echo "-> [Error] El binario de la capa no fue encontrado."
            exit 1
          fi
          
          mkdir -p salida_final
          cp wrapper.tzst salida_final/
