name: Compilar Vortek Standalone (wrapper.tzst)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-vortek:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar tu repositorio de Vortek
        uses: actions/checkout@v4

      - name: 2. Localizar y Configurar el Android NDK Preinstalado
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk-bundle" >> $GITHUB_ENV
          if [ -d "${ANDROID_SDK_ROOT}/ndk" ]; then
            NDK_VER=$(ls -1 ${ANDROID_SDK_ROOT}/ndk | tail -n 1)
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi

      - name: 3. Configurar CMake con el Toolchain del NDK de Android
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release \
                ..

      - name: 4. Compilar el Binario .so de la Capa de Vortek
        run: |
          cd build
          make -j$(nproc)

      - name: 5. Instalar Herramientas de Empaquetado y Patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf

      - name: 6. Forjar Paquete Esencial de Capa Vulkan (wrapper.tzst)
        run: |
          WRAPPER_SO="build/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
            echo "-> [Host] ¡Éxito! Estructurando tu capa Vulkan compatible de producción..."
            rm -rf final_pkg wrapper.tzst
            mkdir -p final_pkg/usr/lib final_pkg/usr/share/vulkan/implicit_layer.d
            
            # 1. Copiamos la librería nativa y le asignamos los permisos de ejecución de Android
            cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
            chmod -R 755 final_pkg/usr/lib/
            
            # 2. Sellamos el nombre dinámico del objeto compartido para evitar corrupciones
            patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
            find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
            
            # 3. Volcamos el manifiesto JSON de la capa que creaste en la Fase 1 en su ruta lícita
            cp -fv vortek_layer.json final_pkg/usr/share/vulkan/implicit_layer.d/
            
            sync && sleep 3
            
            # 4. Comprimimos localmente replicando el empaquetado indestructible de Gamenative
            cd final_pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..
            echo "-> ¡Paquete de capa Vulkan original puro forjado con éxito!"
          else
            echo "-> [Error] El binario de la capa no fue encontrado."
            exit 1
          fi
          
          mkdir -p salida_final
          cp wrapper.tzst salida_final/

      - name: 7. Guardar y Subir el .wrapper.tzst como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vortek-Layer-Bannerlator
          path: salida_final/
