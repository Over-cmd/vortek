name: Compilar Vortek Standalone (wrapper.tzst)

on:
  workflow_dispatch: # Activa el botón de disparo manual en la pestaña Actions
  push:
    branches: [ main ]

jobs:
  build-vortek:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar tu repositorio de Vortek
        uses: actions/checkout@v4

      - name: 2. Localizar y Configurar el Android NDK Preinstalado
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk-bundle" >> $GITHUB_ENV
          if [ -d "${ANDROID_SDK_ROOT}/ndk" ]; then
            NDK_VER=$(ls -1 ${ANDROID_SDK_ROOT}/ndk | tail -n 1)
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi

      - name: 3. Configurar CMake con el Toolchain del NDK de Android
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release \
                ..

      - name: 4. Compilar el Binario .so de Vortek
        run: |
          cd build
          make -j$(nproc)

      - name: 5. Instalar Herramientas de Compresión Zstd en el Servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: 6. Fabricar Estructura y Empaquetar en wrapper.tzst
        run: |
          # Creamos la estructura exacta que el instalador de Bannerlator espera leer
          mkdir -p estructura_wrapper/lib
          cp build/libvulkan_vortek.so estructura_wrapper/lib/
          
          # Generamos el manifiesto ICD oficial apuntando a la ruta genérica interna
          cat << 'EOF' > estructura_wrapper/vortek_icd.json
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "libvulkan_vortek.so",
                  "api_version": "1.3.0"
              }
          }
          EOF
          
          # Comprimimos la carpeta usando Tar + Zstandard para dar a luz al wrapper.tzst
          cd estructura_wrapper
          tar -I zstd -cf ../vortek.wrapper.tzst lib/ vortek_icd.json
          cd ..
          
          # Preparamos la carpeta de salida limpia para el artefacto de GitHub
          mkdir -p salida_final
          cp vortek.wrapper.tzst salida_final/

      - name: 7. Guardar y Subir el .wrapper.tzst como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vortek-Wrapper-Bannerlator
          path: salida_final/
