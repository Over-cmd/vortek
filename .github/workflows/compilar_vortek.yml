name: Compilar Vortek Standalone (wrapper.tzst)

on:
  workflow_dispatch: # Activa el botón de disparo manual en la pestaña Actions
  push:
    branches: [ main ]

jobs:
  build-vortek:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar tu repositorio de Vortek
        uses: actions/checkout@v4

      - name: 2. Localizar y Configurar el Android NDK Preinstalado
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk-bundle" >> $GITHUB_ENV
          if [ -d "${ANDROID_SDK_ROOT}/ndk" ]; then
            NDK_VER=$(ls -1 ${ANDROID_SDK_ROOT}/ndk | tail -n 1)
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi

      - name: 3. Configurar CMake con el Toolchain del NDK de Android
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-26 \
                -DCMAKE_BUILD_TYPE=Release \
                ..

      - name: 4. Compilar el Binario .so de Vortek
        run: |
          cd build
          make -j$(nproc)

      - name: 5. Instalar Herramientas de Compresión Zstd en el Servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: 6. Instalar Herramientas de Empaquetado y Patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf

      - name: 7. Forjar Paquete Esencial Original de Rendimiento Máximo (wrapper.tzst)
        run: |
          WRAPPER_SO="build/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
            echo "-> [Host] ¡Éxito! Estructurando tu paquete original compatible de producción..."
            rm -rf final_pkg wrapper.tzst
            mkdir -p final_pkg/usr/lib final_pkg/usr/share/vulkan/icd.d
            
            cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
            
            # Otorgamos los permisos de ejecución de sistema obligatorios para Android
            chmod -R 755 final_pkg/usr/lib/
            
            # Sella el nombre de la librería interna para el cargador biónico
            patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
            find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
            
            # Tu manifiesto original plano compatible con Bannerlator
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
            
            sync && sleep 3
            
            # Compresión limpia que ZArchiver y Bannerlator devorarán a la primera
            cd final_pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..
            echo "-> ¡Paquete original puro forjado con éxito!"
          else
            echo "-> [Error] El binario compilar no fue encontrado."
            exit 1
          fi
          
          # Preparamos la carpeta de salida limpia para el artefacto de GitHub
          mkdir -p salida_final
          cp wrapper.tzst salida_final/

      - name: 8. Guardar y Subir el .wrapper.tzst como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vortek-Wrapper-Bannerlator
          path: salida_final/
